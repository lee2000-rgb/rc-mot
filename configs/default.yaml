# RC-MOT default configuration (4D radar + camera, construction site)
calib: calib/construction_field.json   # copied from 23.send calib.json (radar -> level -> camera); re-calibrate for the Orin rig

topics:
  radar: /off_highway_premium_radar_sample_driver/locations
  image: /oak/rgb/image_raw/compressed
  imu: /ouster/imu

detector:
  weights: models/yolo11s.pt          # Orin: models/yolo11s_fp16.engine (scripts/export_trt.sh)
  imgsz: 960
  conf: 0.1                           # low threshold kept for ByteTrack-style second association
  class_map:                          # COCO name -> project class
    person: worker
    truck: heavy_equipment
    bus: heavy_equipment
    car: heavy_equipment

ego_velocity:
  inlier_thr: 0.2                     # m/s, RANSAC
  planar: true
  standstill_p70: 0.05                # |v_r| 70th percentile below this -> ego = 0
  ema_alpha: 0.4

tracker:
  high_thr: 0.5
  low_thr: 0.1
  new_thr: 0.6
  min_hits: 3
  max_lost_s: 1.5
  relink_fragment_aware: true         # docs/32 §5: ratio-test rivals skip the candidate's own fragments (never alive together
                                      # + close in appearance); false = the old relink
  app_w_emb: 3.0                      # docs/32 §5: OSNet weight in the fused appearance distance (with reid.part_colour)
  w3d: 0.6
  w2d: 0.4
  wdop: 0.2
  dac: true                           # distance-adaptive cost (MOTDD SAAC analogue)
  max_radar_only_s: 3.0
  # reentry_memory: false             # swing re-entry memory (docs/33 Track C, research/fusion_wave/trackC): OUT_OF_VIEW
  #                                   # memories (world anchor + motion mode + gallery), ID decided at confirmation;
  #                                   # replaces the appearance-only relink at birth. Other reentry_* keys: TrackerParams

ego_comp: true                        # 3D ego-motion compensation (MOTDD CMC analogue)

# Current defaults that live only in the code (dataclass defaults; no site config overrides them), listed for reference:
# fusion:                             # rcmot.fusion.radar_camera.FusionParams
#   range_model: lik                  # range as a per-box distribution (docs/37-38, default since 11-03); "legacy" = the
#                                     # docs/30 cluster path documented in the commented block below
#   range_lik_params: configs/range_lik/full.json   # fitted on the 19 GT segments (loso/<seg>.json for fair evaluation)
#   lik_wedge_fallback: false         # BEV azimuth-wedge clusters for boxes without in-box clusters (docs/41 §7: hurt online)
# tracker:                            # rcmot.tracking.tracker.TrackerParams (lik_* keys: docs/38 §4-§7)
#   lik_bias: false                   # per-track camera bias (off since 11-03, docs/38 §10.6)
#   lik_mask: basin                   # a track may take only basins with >= 5 % mass
#   lik_reanchor: true                # 3 consistent radar-backed votes move a track (docs/38 §7.4)
# scan_stats:                         # rcmot.radar.scan_stats.ScanStatsParams (docs/35 §3, docs/38 §12)
#   alpha_source: none                # point reliability weight off (alpha = 1) since 11-03
#   drop_source: rcs_scan             # weak-and-isolated: whole-scan RCS z < -2 and no point within 1.5 m (since 11-04)
#   ambig_source: z                   # elevation-ambiguity pair: keep the member nearer ground + 1 m (since 11-05, docs/48 §5.8;
#                                     # rcs = drop the lower-RCS member, 11-04..11-05)
#   ground_sigma: elev                # below-ground drop: z < ground line - max(3 s(r), 1 m), s(r) = hypot(0.03, 0.0075 r)
#                                     # (since 11-04, docs/38 §13; "mad" = the old per-bin MAD, meaningless beyond 35 m)
# fusion (BEV wedge evidence, docs/38 §13.6, off): lik_wedge_mode off | fallback | prod, lik_wedge_beta 0.5,
#   lik_wedge_mirror true, lik_wedge_exclusive true, lik_wedge_window 0 (r56: prod 0.3 + window 0.05 = BEV HOTA +0.010,
#   IDsw +11 -> not default)

# fusion:                             # radar-camera fusion (rcmot.fusion.radar_camera.FusionParams; code defaults apply when
#   cluster_score: lr                 # absent). docs/30: "lr" = range clusters of the in-box returns scored by the layout
#                                     # descriptor (configs/fusion_cluster_lr.json) x 2-D track gate; "off" = the KDE x prior path
#   cluster_score_model: configs/fusion_cluster_lr.json   # or configs/fusion_cluster_lr10.json (the 10 features of docs/30 §3)
#   cluster_gate_chi2: 9.21           # chi2_2 on (track P + cluster_gate_sigma^2 I)
#   cluster_gate_sigma: 0.5
#   cluster_gate_speed: {worker: 2.5, default: 8.0}   # [m/s] reach gate speed * dt + cluster_gate_margin [m]
#   cluster_gate_margin: 1.0
#   cluster_gate_fail: camera         # no cluster passes: camera / track range ("camera") | old KDE path ("kde")
#   cluster_gate_mono_override: 0.1   # ... but take the best cluster when it agrees with the height prior within 10 % (static ego only:
#   override_static_only: true        # ego_static_speed 0.2 m/s, ego_static_yaw_deg 8)
#   cluster_score_no_track: lr        # box without a track prior: best cluster by score ("lr") | old path ("kde")
#   cluster_range: kde                # range inside the chosen cluster: "kde" | "median"
#   point_bearing: false              # bearing from the cluster centroid (off: hurts tracking on moving ego)
#   track_prior_ego_lag_s: 0.0        # widen the 2-D prior by the ego motion over this lag [s]
#   ground_gate_mono_fallback: true   # xpanner level-frame defect (docs/30 §4): gate on the height prior when the ground
#   ground_gate_mono_ratio: 2.0       # ray disagrees with it by more than this factor
#   # moving ego (docs/30 §6-8, impl2); all *_moving_only keys keep a static ego (ego_static_speed / _yaw_deg) bit-identical
#   prior_img_time: true              # 2-D prior + projected track box propagated to the image time (yaw_rate x (dt + img_dt))
#   prior_sigma_w_deg: 1.2            # gyro noise [deg/s]: prior widened across the line of sight by (horizon x sigma_w x r)^2
#   prior_sigma_v_ego: 0.1            # ego speed noise [m/s]: along the line of sight by (horizon x sigma_v)^2
#   prior_moving_only: true
#   box_time: true                    # radar points rotated by yaw_rate x (img_dt + calib.radar_time_offset_s - radar_lag_s)
#   box_time_moving_only: true        # before the in-box test (fuse in the image's time), result rotated back to the scan
#   radar_lag_s: {bosch: -0.13, conti: -0.067}   # [s] scan = state at header + lag (online swing scan, impl2); "calib" = the calib's
#                                     # radar_time_offset_s; only the difference to it enters (rf.stamp carries the calib value)
#   cluster_gate_safety_ref: camera   # reference of the safety net: KDE x camera prior ("camera") | x track prior too ("old")
#   gate_turn_yaw_deg: 8.0            # |yaw_rate| above this: 2-D gate widened laterally by sigma_az(r) x r (design §4.3)
#   gate_sigma_c_deg: 0.3             # sigma_az^2 = sigma_c^2 + sigma_radar^2 + (yaw_rate sigma_dt)^2 + (sigma_w horizon)^2
#   gate_sigma_radar_deg: 1.0
#   gate_sigma_dt_s: 0.015
#   cluster_gate_safety_m: 1.0        # a cluster within this of the old KDE x prior pick is never gated out (0 = off)
#   cluster_gate_safety_moving_only: true
#   turn_box_window: false            # while turning: in-box window widened by 10 % lateral / 5 % vertical instead of shrunk
#   # docs/33 wave 3 (all off by default; research/fusion_wave/wave3/report.md)
#   mask_weight: hard                 # Track A: hard (mask_out_weight outside, unweighted cluster features) | const | gauss_px
#                                     # | gauss_m: per-point mask factor, cluster features weighted by it
#   mask_sigma_ang_deg: 0.3           # gauss_px: sigma_px = max(floor, fx sigma_ang) + fx |yaw_rate| sigma_dt
#   mask_sigma_floor_px: 1.5
#   mask_sigma_dt_s: 0.015
#   mask_sigma_m: 0.2                 # gauss_m: lateral offset d r / fx against this
#   mask_min_weight: 0.05             # points below this factor leave the box
#   mask_soft_min_p: 0.2              # a cluster with no point ON the mask is used only at p >= this (0: wave-3 behaviour)
#   mask_hard_below_m: 15.0           # box range reference (track prior, else height prior, else ground ray) below this: hard
#   cluster_dmap: false               # Track B B-b: boxes with a depth-map range scored by cluster_score_model_dmap
#   cluster_score_model_dmap: configs/fusion_cluster_lr_dmap.json   # the 11 features + |ln(r_cluster / r_dmap)|
#   dmap_fallback: false              # Track B B-a: no usable radar cluster -> depth-map range x per-track bias, source "dmap"
#   dmap_min_range: 15.0              # ... only for r_dmap >= this (and <= depth_map.max_range)
#   dmap_fallback_bias_only: false    # ... only for boxes whose track has a radar / dmap bias (radar history)
depth_map:                            # top-level: online depth stage (rcmot.fusion.depth_stage); on since 11-04 (docs/41 §9.5):
  enable: true                        # feeds the range distribution's depth cue "dm" (r43: HOTA +0.008, false objects -27 %;
                                      # LOSO re-check r45: HOTA +0.007, IDsw 71 -> 55, false objects -8 %)
#   every: 3                          # DA-V2 Small + radar fit every 3rd frame, the frames in between reuse that map (6 = same results, r46)
#   input_hw: [518, 924]              # or [392, 700] (0.64x network cost; r46: loses the alarm range gain)
#   n_frames: 3                       # static scans accumulated (ego-motion compensated) for the fit
#   max_range: 25.0                   # r_dmap above this is not offered (r46: 40 m was worse, HOTA -0.005)
#   quality_rel_err: 0.10             # fit inlier median relative error above this: not offered
#   max_rejects: 3                    # a KF-rejected / failed fit: that map is not offered; N in a row: the (s,t) filter restarts
#   bias_window_s: 10.0               # B-a per-track bias: median radar / dmap ratio over this window, >= bias_min_n samples
#   bias_min_n: 3
#   bias_range: [0.67, 1.5]           # a track bias outside this is not used; bias_max_tcam_s: 1.0 (one-to-one box <-> track lookup)
#   sigma_rel_floor: 0.06
cell_memory:                          # top-level: BEV cell memory of static radar returns (rcmot.radar.cell_memory, docs/41 §8-10);
  enable: false                       # opt-in: r44 vs the depth-on default with the same parameters (r43 DM_on): tracking neutral
                                      # (HOTA +0.001 [-0.002, +0.003]), false objects within 20 m 1.98 -> 1.88 (2 segments); ~2 ms CPU
#   cell_m: 0.5                       # BEV cell size (level frame of the vehicle)
#   window_s: 5.0                     # background score = share of the last window_s with a learned static return in the 3x3 block
#   min_learn_s: 5.0                  # continuous standstill before the score is used (cleared as soon as the machine moves)
#   exclude_m: 1.0                    # returns this close to a worker track / person box range are not learned
#   margin_deg: 1.5                   # person-box azimuth wedge margin for the learning exclusion
#   bg_slope: -4.14                   # cluster factor exp(bg_slope * mean bg) on the layout score, clipped to [f_min, 1]
#   f_min: 0.05
# radar_type: bosch                   # top-level: key of fusion.radar_lag_s (bosch | conti); default from the radar topic name

recovery:                             # Radar-Gated Recovery (MOTDD PGR + radar), docs/05_motdd_radar_extension.html
  enable: true
  K: 4
  crop_scale: 3.0
  min_crop: 192
  conf_thresh: 0.1
  gate_iou: 0.3
  gate_buffer_ratio: 0.2
  use_radar_roi: true                 # false -> ROI from the KF prediction only (PGR)
  use_radar_gate: true                # false -> buffered-IoU gate only (PGR)
  radar_only: true                    # keep tracks alive on radar points when the camera misses
  fuse_track_prior: true              # docs/30: recovered boxes fused with the track's range / BEV prior (cluster gate)

reid:                                 # appearance re-identification (docs/09 §5)
  enable: true
  weights: models/reid/osnet_x0_25_msmt17.pth   # or models/reid/osnet_ain_x1_0_msmt17.pth (better cross-domain, heavier)
  # same-helmet / same-vest crews (docs/32 §5, training-free; both false = the plain masked-OSNet cosine):
  crowd_mean: true                    # subtract the mean embedding of the workers in the frame (>= 2, score >= 0.5)
  part_colour: true                   # + pants / sleeve / shoe / whole-minus-crowd Lab histograms (fused distance,
                                      # ~1.4 ms per person on the PC, ~3 ms estimated on Orin)
  # part_max_pitch_deg: 20            # steeper camera (excB 26 deg): body bands off, crowd mean only
  # old baseline: --set reid.crowd_mean=false --set reid.part_colour=false --set tracker.app_w_emb=1
  #               --set tracker.relink_fragment_aware=false

gui:
  bev_range: 20.0                     # BEV half-width [m] (mouse wheel zooms)
  danger_m: 5.0                       # gallery card turns red inside this range
  zones: [5.0, 10.0, 15.0]            # BEV danger / warning / caution discs

alarm:                                # PoC demo (docs/18): zone beeps over the speaker, toggle "경보" in the GUI
  enable: false
  zones: [10.0, 20.0, 30.0]           # danger / warning / caution [m]
  hysteresis: 1.0                     # leave a zone only this far beyond its boundary
  confirmed_only: true                # counting rule (docs/38 §10.4; code default since 11-04, every config): confirmed tracks,
  lost_grace_s: 0.5                   # LOST tracks for 0.5 s, RADAR_ONLY tracks for 1 s after the camera last saw them --
  radar_only_grace_s: 1.0             # the rule the alarm results (r39-r47) were scored with
  sounds:
    danger: assets/sounds/beep_800Hz_3_continuous.wav
    warning: assets/sounds/beep_800Hz_2_fast.wav
    caution: assets/sounds/beep_800Hz_1_slow.wav
