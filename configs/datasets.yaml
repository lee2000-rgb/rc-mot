# Profiles for scripts/rcmot_app.py (--profile NAME, or the profile box in the GUI; docs/18 §1).
#   datasets: bag replays  (bag + config + calib + start)  -> listed when the bag exists on this machine
#   live:     ROS 2 sources (config [+ calib] [+ topics] [+ overrides]) -> listed when rclpy is importable (AGX / field PC)
# Common keys: config, calib (default: the config's), topics (per-key override of the config's topics:), overrides
# ({"a.b": v} applied to the config: model, imgsz, zones ...), note (tooltip). Paths relative to the project root.
datasets:
  boryeong_halt-short:
    bag: data/bags/hdx_boryeong_pg/20251125_4R_bosch_halt-short_LC
    config: configs/hdx_boryeong.yaml
    calib: configs/calib/hdx_boryeong_pg_day1125.json
    start: 85
    note: "HDX 보령 PG, 낮, 자차 정지, 근거리(5-10 m) 작업자 3 + 장비 1 (GT: day_halt_short_085, val_day_haltshort_020)"
