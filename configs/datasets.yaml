    note: "애리조나 Xpanner 현장, 파일 드라이버 장착, 자차 정지, 작업자 2명 15-30 m(한 명 말뚝 옆 웅크림, 한 명 횡단) (GT: xpanner05_static_a 846-906 s, 시험)"
  xpanner03_mixed:
