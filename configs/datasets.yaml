    config: configs/hdx_boryeong_conti.yaml
    calib: configs/calib/hdx_boryeong_pg_conti1126.json
    start: 10
    note: "보령 2025-11-26 낮, Continental ARS548, 자차 주행 측면 통과 (GT 없음)"
  boryeong_conti_halt_short:
    bag: /media/islab/SAMSUNG/ros2_bag_files/conti/20251125_4R_conti_halt-short_LC
    config: configs/hdx_boryeong_conti.yaml
