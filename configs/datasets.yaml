    calib: configs/calib/hdx_boryeong_pg_conti1126.json
    start: 10
    note: "보령 2025-11-26 낮, Continental ARS548, 자차 주행(0.8 m/s) 정면, 작업자 + 굴착기 (GT 없음; 레이더 보정 LiDAR ICP fitness 0.57)"
