live:
  hdx_live_mid:
    config: configs/hdx_agx_live.yaml
    note: "HDX AGX 리그 실시간: 중앙 Bosch 레이더 + OAK-D + Bosch IMU, TensorRT s-seg + OSNet 엔진 (시연 기본)"
  hdx_live_fast:
    config: configs/hdx_agx_live.yaml
    overrides: {detector.weights: models/yolo11n-seg.engine, detector.imgsz: 640, reid.every: 2}
    note: "HDX 실시간 저부하: n-seg 엔진 640 px, ReID 2프레임마다 (GUI 모드에서 15 Hz 유지용; 원거리 검출 약함)"
  hdx_live_accurate:
    config: configs/hdx_agx_live.yaml
    overrides: {detector.weights: models/yolo11s-seg.engine, detector.imgsz: 1280, reid.weights: models/reid/osnet_ain_x1_0_msmt17.pth}
    note: "HDX 실시간 고정밀: s-seg 1280 px + OSNet-AIN x1.0 (느림, 정지 시연·원거리용)"
  hdx_live_left:
    config: configs/hdx_agx_live.yaml
    topics: {radar: /radar_left/driver/locations}
    note: "HDX 실시간, 왼쪽 Bosch 레이더 (보정은 중앙 레이더 것: 투영 확인 전에는 참고용)"
  hdx_live_right:
    config: configs/hdx_agx_live.yaml
    topics: {radar: /radar_right/driver/locations}
    note: "HDX 실시간, 오른쪽 Bosch 레이더 (보정은 중앙 레이더 것: 투영 확인 전에는 참고용)"
  conti_live:
    config: configs/hdx_boryeong_conti.yaml
    calib: configs/calib/hdx_boryeong_pg_conti1126.json
    topics: {image: /oak/rgb/image_raw/compressed, imu: /bosch_imu/imu}
    overrides: {depth_map.enable: false}   # live: depth stage only after the Orin timing (as hdx_agx_live)
    note: "Continental ARS548 리그 실시간 (/radar/radar_detection_image), 보령 11-26 보정. 주의: 실시간 경로는 센서 시계 헤더를 변환하지 않아 영상과 짝이 안 맺어질 수 있음 (docs/21 §5.6, 미해결)"
  hdx_live_site:
    config: configs/hdx_agx_live.yaml
    calib: configs/calib/field_hdx_20261024_111633.json
    note: "HDX AGX 리그 실시간, 10-24 현장 보정(hdx_20261024_111633 bag)"
  hdx_live_site_indoor:
    config: configs/hdx_agx_live.yaml
    calib: configs/calib/field_hdx_20261024_111633.json
    overrides: {alarm.zones: [3.0, 5.0, 10.0], alarm.hysteresis: 0.3}
    note: "실내 시험용: 경보 구역 3/5/10 m, 히스테리시스 0.3 m (시연은 hdx_live_site: 10/20/30 m, 1.0 m)"
