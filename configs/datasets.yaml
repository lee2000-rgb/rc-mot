    config: configs/hdx_20261026.yaml
    calib: configs/calib/field_hdx_20261026_142258.json
    overrides: {world.lever_arm: [1.17, -0.89], recon.enable: true, depth_map.enable: false}   # VGGT-Omega needs the GPU memory
    start: 37
    note: "10-26 굴착기 A(안전관제) 직진 -> 180° 선회 -> 직진 복귀, 1.5분(선회 42 s부터, 최대 35 °/s), 진동 최대 (IMU: Ouster)"
